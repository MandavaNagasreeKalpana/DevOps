# Only allow incoming traffic to the web pods on the HTTP port.
# The internal metrics port (8081) is reachable only from pods labelled
# app.kubernetes.io/name=nginx-exporter in the same namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 80
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-exporter
      ports:
        - port: 8081
          protocol: TCP
