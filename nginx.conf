# Rendered by the nginx image's envsubst step (see Dockerfile).
# Only ${SUPABASE_URL} is substituted; nginx variables such as $uri are left alone.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # --- compression ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- security headers ---
    # (Locations below only use `expires`, which doesn't reset these.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${SUPABASE_URL}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Hashed build output: cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # The HTML shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: deep links like /login are served by index.html.
    location / {
        try_files $uri /index.html;
    }
}
