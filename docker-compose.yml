# Build args are read from .env.local via:
#   docker compose --env-file .env.local up --build      (or: npm run docker:up)
services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL (use --env-file .env.local)}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set VITE_SUPABASE_ANON_KEY (use --env-file .env.local)}
    image: secure-file-share:local
    ports:
      - "8080:80"
    restart: unless-stopped
