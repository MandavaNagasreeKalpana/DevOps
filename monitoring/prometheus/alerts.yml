groups:
  - name: secure-file-share
    rules:
      - alert: SiteDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "The HTTP probe for {{ $labels.instance }} has failed for more than 1 minute."

      - alert: SecurityHeadersMissing
        expr: probe_success{job="blackbox-security-headers"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Security headers missing on {{ $labels.instance }}"
          description: "One or more of X-Content-Type-Options, X-Frame-Options or Content-Security-Policy is missing or changed."

      - alert: SlowResponse
        expr: probe_duration_seconds{job="blackbox-http"} > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is responding slowly"
          description: "Responses have taken longer than 1 second for 5 minutes (current: {{ $value | humanizeDuration }})."

      - alert: NginxExporterDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "nginx metrics are unavailable"
          description: "Prometheus cannot scrape the nginx exporter, so request and connection metrics are missing."

      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "nginx is not responding to the exporter"
          description: "The exporter is running but cannot read nginx's stub_status, so the web container is likely stopped or broken."

      - alert: HighActiveConnections
        expr: nginx_connections_active > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of active connections"
          description: "nginx has had more than 100 active connections for 5 minutes (current: {{ $value }})."
