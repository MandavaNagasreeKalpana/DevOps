global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus' own health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # nginx connection and request counters (via stub_status).
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Uptime and response time of the app's pages, probed from inside the network.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web/
          - http://web/login
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Checks that the security headers are still being sent.
  - job_name: blackbox-security-headers
    metrics_path: /probe
    params:
      module: [http_security_headers]
    static_configs:
      - targets:
          - http://web/
    relabel_configs: *blackbox_relabel

  # The blackbox exporter's own metrics.
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]
