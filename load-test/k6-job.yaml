# Runs the k6 script inside the cluster against the web Service.
# Created by scripts/load-test.sh k8s (which also creates the k6-script ConfigMap).
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: secure-file-share
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: k6
          image: grafana/k6:1.1.0
          args: ["run", "/scripts/load.js"]
          env:
            - name: BASE_URL
              value: http://web
            - name: PROFILE
              value: stress
            - name: SUMMARY_PATH
              value: /tmp/summary.json
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: script
          configMap:
            name: k6-script
